server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: boleto-payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/boleto_db
    username: boleto
    password: boleto
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

# Configuração AWS (padrão para ambiente de produção)
aws:
  region: us-east-1
  sns:
    topic-arn: arn:aws:sns:us-east-1:000000000000:boleto-payment-notifications
  s3:
    bucket-name: boleto-receipts
  sqs:
    payment-queue: http://localhost:4566/000000000000/boleto-payment-queue
    polling-interval: 5000
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

# Configuração de resiliência no application.yml
resilience4j:
  circuitbreaker:
    instances:
      s3Service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      snsService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
  retry:
    instances:
      s3Service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      snsService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true